name: Release
on:
  push:
    tags:
      - 'v*'
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-24.04
    env:
      BUILD_ROOT: /tmp/nx-gamehide
    container:
      image: devkitpro/devkita64@sha256:1fc388c3a0d34bd2045a6dadcb1020e069d5f876a187fd705de14b4440c00282
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
      - name: Install host dependencies
        run: apt-get update && apt-get install -y python3 git g++ make gh
      - name: Prepare pinned libraries
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          make dependencies
      - name: Build, test, and package
        run: make -j2 package HOST_CXX=g++
      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          archive="dist/NX-GameHide-${GITHUB_REF_NAME}.zip"
          test -f "$archive"
          gh release create "$GITHUB_REF_NAME" "$archive" --verify-tag --title "NX-GameHide ${GITHUB_REF_NAME}" --generate-notes --notes "Hide and restore Nintendo Switch HOME menu games through Tesla without deleting games or saves. Download the ZIP below, extract it to the SD card root, and fully reboot. See the README for requirements, usage and troubleshooting."
